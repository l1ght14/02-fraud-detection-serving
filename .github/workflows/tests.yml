name: tests

# No `branches:` filter on purpose. This repo's default branch is `master`, and a
# workflow listening only to `main` never runs -- it shows as "active" while
# producing zero runs, which reads as a passing project to anyone who does not
# open the Actions tab.
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest tests/ -q --junitxml=report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report.xml

  # The README claims a container that runs. This is the only thing that keeps
  # that claim honest: an image that builds but cannot start is the most common
  # way a portfolio deployment project quietly stops being true.
  #
  # Requires a committed artifacts/model.joblib. That file is gitignored because
  # it is ~10MB of fitted forest, so the job trains first if it is missing rather
  # than failing on a fresh clone.
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Cache the Kaggle dataset
        id: kaggle
        uses: actions/cache@v4
        with:
          path: data
          key: fraud-${{ hashFiles('data/creditcard.csv') }}

      - name: Download the dataset
        if: steps.kaggle.outputs.cache-hit != 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          python -m kaggle datasets download -d mlg-ulb/creditcardfraud -p data/ --unzip

      - name: Train if no artifact exists
        if: steps.kaggle.outputs.cache-hit != 'true'
        run: python train.py

      - name: Build image
        run: docker build -t fraud-api:ci .

      - name: Smoke test the container
        run: |
          docker run -d --name fraud -p 8000:8000 fraud-api:ci
          # Poll /health rather than sleeping: a fixed sleep is either slow when
          # the model loads fast or flaky when it does not.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "container healthy after ${i}s"
              curl -s http://localhost:8000/health
              docker rm -f fraud
              exit 0
            fi
            sleep 1
          done
          echo "container never became healthy"
          docker logs fraud
          docker rm -f fraud
          exit 1