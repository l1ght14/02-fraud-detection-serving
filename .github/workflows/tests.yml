name: tests

on:
  # workflow_dispatch so CI can be re-run on demand; the initial gh repo create --push`n  # does not fire Actions, so without this a reviewer sees no checks at all.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest tests/ -q --junitxml=report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report.xml

  # The README claims a container that runs. This is the only thing that keeps
  # that claim honest: an image that builds but cannot start is the most common
  # way a portfolio deployment project quietly stops being true.
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t fraud-api:ci .

      - name: Smoke test the container
        run: |
          docker run -d --name fraud -p 8000:8000 fraud-api:ci
          # Poll /health rather than sleeping: a fixed sleep is either slow when
          # the model loads fast or flaky when it does not.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "container healthy after ${i}s"
              curl -s http://localhost:8000/health
              docker rm -f fraud
              exit 0
            fi
            sleep 1
          done
          echo "container never became healthy"
          docker logs fraud
          docker rm -f fraud
          exit 1
